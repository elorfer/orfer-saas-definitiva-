version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: vintage-music-postgres
    environment:
      POSTGRES_DB: vintage_music
      POSTGRES_USER: vintage_user
      POSTGRES_PASSWORD: vintage_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vintage_user -d vintage_music" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vintage-network

  # Redis para estadísticas en tiempo real
  redis:
    image: redis:7-alpine
    container_name: vintage-music-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vintage-network

volumes:
  postgres_data:
  redis_data:


networks:
  vintage-network:
    driver: bridge
