  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

# Configuración del Splash Screen
flutter_native_splash:
  color: "#0a0a0a"  # Fondo negro elegante
  color_dark: "#0a0a0a"  # Mismo para dark mode
  
  # Logo de Struky (Tu archivo seleccionado)
  image: assets/images/logosplash.png
  image_dark: assets/images/logosplash.png
  
  android: true
  ios: true
  web: false
  
  android_12:
    color: "#0a0a0a"
    image: assets/images/logosplash.png
    
  android_gravity: center
  ios_content_mode: center
  fullscreen: true

# Configuración del Ícono de la App
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logosplash.png"
  adaptive_icon_background: "#0a0a0a"
  adaptive_icon_foreground: "assets/images/logosplash.png"
  remove_alpha_ios: true
