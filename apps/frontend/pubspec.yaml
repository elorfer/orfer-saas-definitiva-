name: vintage_music_app
description: Aplicación de streaming musical vintage para usuarios y artistas

publish_to: 'none'

version: 1.0.3+11

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296
  google_fonts: ^8.0.2
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # State Management
  provider: ^6.1.2
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1
  # ... other dependencies ...

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.8.1
  socket_io_client: ^3.1.4  # WebSocket para notificaciones en tiempo real

  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.0.0

  # Audio & Media
  just_audio: ^0.10.5
  audio_service: ^0.18.12
  audio_session: ^0.2.2
  rxdart: ^0.28.0
  # flutter_media_metadata: ^1.0.0  # Temporalmente deshabilitado por problema de namespace

  # File & Image Handling
  image_picker: ^1.0.7
  file_picker: ^10.3.3
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  palette_generator: ^0.3.3+4

  # Navigation
  go_router: ^17.1.0
  auto_route: ^9.3.0+1

  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  url_launcher: ^6.2.5
  share_plus: ^12.0.0
  connectivity_plus: ^7.0.0
  device_info_plus: ^12.1.0
  path: ^1.9.0
  logger: ^2.4.0
  flutter_displaymode: ^0.7.0

  # Charts & Analytics
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^33.1.44

  # Animations
  flutter_staggered_animations: ^1.1.1
  animate_do: ^4.2.0

  # Forms & Validation
  form_builder_validators: ^11.2.0
  flutter_form_builder: ^10.2.0

  # Notifications
  # flutter_local_notifications: ^19.4.2  # Temporalmente deshabilitado por problema de desugaring
  # firebase_messaging: ^16.0.2

  # Social & Auth
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  
  # Payments & Subscriptions
  purchases_flutter: ^9.15.0  # RevenueCat SDK para suscripciones premium

  # QR & Barcode
  qr_flutter: ^4.1.0
  dio_cache_interceptor: ^4.0.6
  http_cache_hive_store: ^5.0.1
  flutter_cache_manager: ^3.4.1
  marquee: ^2.3.0
  encrypt: ^5.0.3
  sentry_flutter: ^9.9.2
  flutter_facebook_auth: ^7.1.5
  flutter_animate: ^4.5.2
  google_mobile_ads: ^7.0.0
  visibility_detector: ^0.4.0+2
  package_info_plus: ^9.0.1
  # qr_code_scanner: ^1.0.1  # Temporalmente deshabilitado por problema de namespace

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  retrofit_generator: ^8.1.0
  auto_route_generator: ^9.0.0
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0

  # Testing
  mockito: ^5.4.4
  
  # Splash Screen
  flutter_native_splash: ^2.4.0
  
  # App Icons
  flutter_launcher_icons: ^0.14.4
#   integration_test:
#     sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/vintage_hero_bg.png
    - assets/images/vintage_hero_wide.png
    - assets/images/feature_hidden_music.png
    - assets/images/feature_algorithm.png
    - assets/images/feature_composers.png
    - assets/images/composer_service_bg.png
    - assets/images/onboarding/
    - assets/images/coffes/
  #   - assets/icons/
  #   - assets/animations/
  #   - assets/fonts/

  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Regular.ttf
