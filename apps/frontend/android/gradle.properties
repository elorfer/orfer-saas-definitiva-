## Ajustado para evitar OOM del daemon en sistemas con memoria limitada
# Reducir heap máximo y metaspace para que Gradle no consuma excesiva memoria nativa
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.java.home=C:/Program Files/Android/Android Studio1/jbr
android.useAndroidX=true
android.enableJetifier=true
